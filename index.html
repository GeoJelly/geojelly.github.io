<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed El-Glaly | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059; /* لون ذهبي مطابق للكوفر */
            --dark: #0a0a0a;
            --gray: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            color: white;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .portfolio-card {
            width: 90%;
            max-width: 900px;
            padding: 40px;
            border-top: 1px solid rgba(197, 160, 89, 0.3);
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            text-align: center;
            position: relative;
        }

        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .logo-icon {
            font-size: 3rem;
            color: var(--gold);
            border-left: 2px solid var(--gold);
            padding-left: 25px;
            margin-left: 10px;
        }

        .main-info {
            text-align: right;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: white;
            margin-top: 5px;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* سطر الأيقونات المميز في الكوفر */
        .features-grid {
            display: flex;
            justify-content: space-around;
            margin: 40px 0;
            padding: 20px 0;
            border-right: 1px solid rgba(197, 160, 89, 0.2);
            border-left: 1px solid rgba(197, 160, 89, 0.2);
        }

        .feature-item {
            text-align: center;
            padding: 0 10px;
        }

        .feature-item i {
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .feature-item span {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray);
        }

        /* التصنيفات السفلية */
        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: white;
            flex-wrap: wrap;
        }

        .tech-stack span {
            position: relative;
        }

        .tech-stack span:not(:last-child)::after {
            content: "•";
            margin-right: 20px;
            color: var(--gold);
        }

        .construction-notice {
            margin-top: 50px;
            font-size: 0.9rem;
            color: var(--gold);
            font-style: italic;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .header-section { flex-direction: column; }
            .logo-icon { border-left: none; border-bottom: 2px solid var(--gold); padding: 0 0 15px 0; }
            .features-grid { flex-wrap: wrap; gap: 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <div class="header-section">
            <div class="logo-icon">
                <i class="fa-solid fa-code"></i>
            </div>
            <div class="main-info">
                <h1>MOHAMED EL-GLALY</h1>
                <div class="subtitle">FULL STACK ENGINEER</div>
            </div>
        </div>

        <div class="features-grid">
            <div class="feature-item">
                <i class="fa-solid fa-file-code"></i>
                <span>Clean Code</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Security</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Scalability</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-rocket"></i>
                <span>Performance</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-mobile-screen"></i>
                <span>Responsive</span>
            </div>
        </div>

        <div class="tech-stack">
            <span>FRONTEND</span>
            <span>BACKEND</span>
            <span>DATABASE & CMS</span>
            <span>INFRASTRUCTURE</span>
        </div>

        <div class="construction-notice">
            <i class="fa-solid fa-wrench"></i> الموقع حالياً قيد التطوير ليناسب طموحاتكم
        </div>
    </div>

</body>
</html>

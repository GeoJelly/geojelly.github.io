<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJelly | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            border-radius: 20px;
            background: rgba(7, 48, 110, 0.2); /* كحلي شفاف */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        h1 { color: #4facfe; margin-bottom: 0.5rem; }
        p { color: #a0a0a0; font-size: 1.2rem; }
        .badge {
            display: inline-block;
            padding: 5px 15px;
            background: #07306E;
            border-radius: 50px;
            font-size: 0.8rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>محمد الجلالي (GeoJelly)</h1>
        <p>مرحباً بكم في موقعي الشخصي - حاليًا الموقع قيد الإنشاء</p>
        <div class="badge">CachyOS User | Web Developer</div>
    </div>
</body>
</html>
